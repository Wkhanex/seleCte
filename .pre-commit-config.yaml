# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Generated corpora: level dumps and probability-estimation
        # dicts are written by scripts, not by hand.
        exclude: ^src/seleCte/(data/levels|pcg/preprocessing)/.*\.json$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      - id: uv-lock          # keeps uv.lock in sync with pyproject.toml

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.64
    hooks:
      - id: ty
